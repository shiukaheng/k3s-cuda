services:
  k3s:
    build:
      context: .
      args:
        K3S_VERSION: ${K3S_VERSION:-v1.36.0-k3s1}
        NVIDIA_TOOLKIT_IMAGE: ${NVIDIA_TOOLKIT_IMAGE:-nvcr.io/nvidia/k8s/container-toolkit:v1.17.8-ubuntu20.04}
    image: ${K3S_IMAGE:-k3s-cuda:v1.36.0-k3s1}
    hostname: k3s-server-1
    privileged: true
    gpus: all
    ports:
      - "6443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-cni:/var/lib/cni
      - k3s-kubelet:/var/lib/kubelet
    command: server

volumes:
  k3s-data:
  k3s-cni:
  k3s-kubelet:
