name: Bug report
description: Report a host, image, CDI, or workload failure
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Confirm the README's Docker GPU prerequisite before filing when possible.
  - type: textarea
    id: host
    attributes:
      label: Host environment
      description: Distribution, architecture, kernel, Docker version, GPU, driver, and NVIDIA Container Toolkit version.
    validations:
      required: true
  - type: textarea
    id: prerequisite
    attributes:
      label: Docker GPU prerequisite output
      description: Output from the README's `docker run --rm --gpus all ... nvidia-smi` command.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure and logs
      description: Include the failed command, container logs, pod events, and runtime inspection output.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Non-secret `.env` values and any changed manifests or run arguments.
